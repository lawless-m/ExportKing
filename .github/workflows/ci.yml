name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: development happens on Linux but every consumer
        # (RocsMiddleware, CS-EM2Parquet) publishes win-x64.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build ExportKing.Tests/ExportKing.Tests.csproj -c Release

      # The live integration tests (IntegrationSmokeTests) self-skip when
      # DBISAM_HOST is unset, so only the offline unit tests run here.
      - name: Test
        run: dotnet test ExportKing.Tests/ExportKing.Tests.csproj -c Release --no-build
